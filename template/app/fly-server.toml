# fly.toml app configuration file generated for riskcam-server on 2026-11-20T16:18:55+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'riskcam-server'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
